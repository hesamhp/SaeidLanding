<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meet Our Trainers — PULSE Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;700&family=Tajawal:wght@400;500;700;900&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ---------- Reset & Base ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #07070a;
    color: #fff;
    font-family: 'Inter', 'Tajawal', 'Noto Naskh Arabic', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
    overscroll-behavior: none;
  }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* Safe-area for notched phones */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }

  /* ---------- Slider shell ---------- */
  .slider {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #07070a;
  }

  /* ---------- Slides ---------- */
  .slides {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    align-items: stretch;
    opacity: 0;
    visibility: hidden;
    transition: opacity .9s cubic-bezier(.7,.0,.3,1), visibility 0s linear .9s;
    pointer-events: none;
  }
  .slide.is-active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .9s cubic-bezier(.7,.0,.3,1);
  }

  /* Stagger animation on each slide content */
  .slide.is-active .anim { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
  .slide.is-active .anim.d1 { animation-delay: .15s; }
  .slide.is-active .anim.d2 { animation-delay: .28s; }
  .slide.is-active .anim.d3 { animation-delay: .42s; }
  .slide.is-active .anim.d4 { animation-delay: .55s; }
  .slide.is-active .anim.d5 { animation-delay: .68s; }
  .slide.is-active .anim.d6 { animation-delay: .82s; }
  .slide.is-active .anim.d7 { animation-delay: .95s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Background blobs ---------- */
  .bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .bg::before, .bg::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .55;
    transition: background 1s ease;
  }
  .bg::before { width: 55vw; height: 55vw; top: -10vw; left: -10vw; }
  .bg::after  { width: 50vw; height: 50vw; bottom: -10vw; right: -5vw; }
  .slide[data-theme="1"]  .bg::before { background: #6ee7b7; } .slide[data-theme="1"]  .bg::after { background: #a78bfa; }
  .slide[data-theme="2"]  .bg::before { background: #fb7185; } .slide[data-theme="2"]  .bg::after { background: #fb923c; }
  .slide[data-theme="3"]  .bg::before { background: #f472b6; } .slide[data-theme="3"]  .bg::after { background: #fb7185; }
  .slide[data-theme="4"]  .bg::before { background: #dc2626; } .slide[data-theme="4"]  .bg::after { background: #1e293b; }
  .slide[data-theme="5"]  .bg::before { background: #d946ef; } .slide[data-theme="5"]  .bg::after { background: #22d3ee; }
  .slide[data-theme="6"]  .bg::before { background: #f59e0b; } .slide[data-theme="6"]  .bg::after { background: #ef4444; }
  .slide[data-theme="7"]  .bg::before { background: #84cc16; } .slide[data-theme="7"]  .bg::after { background: #06b6d4; }
  .slide[data-theme="8"]  .bg::before { background: #3b82f6; } .slide[data-theme="8"]  .bg::after { background: #94a3b8; }
  .slide[data-theme="9"]  .bg::before { background: #f97316; } .slide[data-theme="9"]  .bg::after { background: #facc15; }
  .slide[data-theme="10"] .bg::before { background: #6366f1; } .slide[data-theme="10"] .bg::after { background: #facc15; }
  .slide[data-theme="11"] .bg::before { background: #a78bfa; } .slide[data-theme="11"] .bg::after { background: #60a5fa; }
  .slide[data-theme="12"] .bg::before { background: #06b6d4; } .slide[data-theme="12"] .bg::after { background: #3b82f6; }

  /* dark overlay for readability */
  .bg .veil {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(7,7,10,.55), rgba(7,7,10,.92) 70%);
  }

  /* subtle grain */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: .12;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- Grid layout ---------- */
  .slide-inner {
    position: relative;
    z-index: 2;
    display: contents;
  }

  .content {
    position: relative;
    z-index: 3;
    padding: 6vh 6vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1.6rem;
    max-width: 760px;
  }

  /* Vertical accent line */
  .content::before {
    content: '';
    position: absolute;
    inset-inline-start: 4vw;
    top: 12vh;
    bottom: 12vh;
    width: 2px;
    background: linear-gradient(180deg, transparent, var(--accent, #fff), transparent);
    opacity: .55;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-size: .82rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: rgba(255,255,255,.7);
  }
  .meta .num {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.1rem;
    letter-spacing: 0;
    color: var(--accent, #fff);
  }
  .meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent, #fff); }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 7.5vw, 6.5rem);
    font-weight: 700;
    line-height: .95;
    letter-spacing: -.02em;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,.65) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .role {
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-size: clamp(.95rem, 1.2vw, 1.15rem);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent, #fff);
  }

  .bio {
    font-size: clamp(.95rem, 1.15vw, 1.1rem);
    line-height: 1.65;
    color: rgba(255,255,255,.75);
    max-width: 38ch;
  }

  .quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1rem, 1.3vw, 1.25rem);
    color: rgba(255,255,255,.55);
    padding-inline-start: 1rem;
    border-inline-start: 1px solid rgba(255,255,255,.2);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-top: .5rem;
  }
  .stat {
    padding: 1rem 1.1rem;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform .3s ease, border-color .3s ease;
  }
  .stat:hover { transform: translateY(-3px); border-color: var(--accent, #fff); }
  .stat .v {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    color: #fff;
    line-height: 1;
  }
  .stat .l {
    margin-top: .35rem;
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-size: .7rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .tag {
    padding: .4rem .85rem;
    border-radius: 999px;
    font-size: .75rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    color: rgba(255,255,255,.8);
    transition: background .3s ease, color .3s ease, border-color .3s ease;
  }
  .tag:hover { background: var(--accent, #fff); color: #07070a; border-color: transparent; }

  /* ---------- Photo column ---------- */
  .photo {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: stretch;
    justify-content: center;
    overflow: hidden;
  }
  .photo-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    mask-image: linear-gradient(180deg, #000 0%, #000 75%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 75%, transparent 100%);
    transition: transform 1.2s cubic-bezier(.2,.7,.2,1), filter 1.2s ease;
    filter: saturate(1.05) contrast(1.05);
  }
  .slide.is-active .photo img { transform: scale(1.02); }

  /* Big number watermark */
  .watermark {
    position: absolute;
    z-index: 4;
    top: 6vh;
    inset-inline-end: 3vw;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(6rem, 14vw, 14rem);
    line-height: 1;
    color: rgba(255,255,255,.05);
    user-select: none;
    pointer-events: none;
  }

  /* Specialty badge */
  .badge {
    position: absolute;
    z-index: 5;
    top: 8vh;
    inset-inline-start: 4vw;
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    padding: .55rem 1rem;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-size: .75rem;
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .badge .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent, #fff);
    box-shadow: 0 0 0 0 var(--accent, #fff);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0   rgba(255,255,255,.55); }
    70%  { box-shadow: 0 0 0 12px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0   rgba(255,255,255,0); }
  }

  /* ---------- Top brand bar ---------- */
  .topbar {
    position: absolute;
    z-index: 10;
    top: 0; left: 0; right: 0;
    padding: 2.2rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .brand {
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: .35em;
    text-transform: uppercase;
    pointer-events: auto;
  }
  .brand .dot { color: var(--accent, #fff); }
  .topbar .right {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    pointer-events: auto;
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-size: .75rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: rgba(255,255,255,.65);
  }
  .topbar .right a {
    color: inherit; text-decoration: none;
    transition: color .3s ease;
  }
  .topbar .right a:hover { color: #fff; }

  /* Actions cluster (nav links + lang toggle) */
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 1.4rem;
    pointer-events: auto;
  }

  /* Language toggle (AR / EN) */
  .lang-toggle {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    padding: .35rem .7rem;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-size: .72rem;
    letter-spacing: .18em;
    transition: background .3s ease, border-color .3s ease;
  }
  .lang-toggle:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
  .lang-toggle .lang-opt {
    color: rgba(255,255,255,.5);
    transition: color .3s ease;
    padding: 0 .15rem;
  }
  .lang-toggle .lang-opt.is-active { color: #fff; }
  .lang-toggle .lang-sep { color: rgba(255,255,255,.3); }

  /* ---------- Bottom progress + dots ---------- */
  .bottombar {
    position: absolute;
    z-index: 10;
    bottom: 0; left: 0; right: 0;
    padding: 2rem 3rem;
    display: flex;
    align-items: center;
    gap: 2rem;
    pointer-events: none;
  }
  .progress {
    flex: 1;
    height: 2px;
    background: rgba(255,255,255,.1);
    border-radius: 2px;
    overflow: hidden;
    pointer-events: auto;
  }
  .progress span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent, #fff);
    transition: width .9s cubic-bezier(.7,.0,.3,1);
  }
  .dots {
    display: flex;
    gap: .55rem;
    pointer-events: auto;
  }
  .dot-btn {
    width: 22px; height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,.18);
    transition: width .3s ease, background .3s ease;
    position: relative;
    overflow: hidden;
  }
  .dot-btn.is-active {
    width: 42px;
    background: rgba(255,255,255,.5);
  }
  .dot-btn.is-active::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent, #fff);
    transform-origin: left;
    animation: fill 8s linear forwards;
  }
  @keyframes fill {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  /* ---------- Side arrows ---------- */
  .nav {
    position: absolute;
    z-index: 9;
    top: 50%;
    transform: translateY(-50%);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: grid; place-items: center;
    transition: background .3s ease, transform .3s ease, border-color .3s ease;
    color: #fff;
  }
  .nav:hover { background: var(--accent, #fff); color: #07070a; border-color: transparent; transform: translateY(-50%) scale(1.06); }
  .nav.prev { inset-inline-start: 1.5rem; }
  .nav.next { inset-inline-end: 1.5rem; }
  .nav svg { width: 22px; height: 22px; }

  /* ---------- Counter ---------- */
  .counter {
    position: absolute;
    z-index: 9;
    bottom: 2rem;
    inset-inline-end: 3rem;
    font-family: 'Playfair Display', 'Tajawal', serif;
    font-size: 1rem;
    letter-spacing: .2em;
    color: rgba(255,255,255,.55);
    pointer-events: none;
  }
  .counter .cur { color: #fff; font-size: 1.4rem; }
  .counter .slash { margin: 0 .4rem; opacity: .5; }

  /* ---------- Hint ---------- */
  .hint {
    position: absolute;
    z-index: 9;
    bottom: 2rem;
    inset-inline-start: 3rem;
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-size: .7rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: rgba(255,255,255,.4);
    pointer-events: none;
    display: flex;
    gap: .7rem;
    align-items: center;
  }
  .hint kbd {
    font-family: 'Space Grotesk', 'Tajawal', sans-serif;
    font-size: .65rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14);
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */

  /* ---- Tablet & below (≤ 1024px) ---- */
  @media (max-width: 1024px) {
    .topbar { padding: 1.6rem 1.8rem; }
    .bottombar { padding: 1.4rem 1.8rem; }
    .content { padding: 5vh 4.5vw; gap: 1.2rem; }
    .content::before { inset-inline-start: 2.5vw; top: 8vh; bottom: 8vh; }
    .nav { width: 50px; height: 50px; }
  }

  /* ---- Mobile layout (≤ 768px) ---- */
  @media (max-width: 768px) {
    /* Stack: photo top, content bottom */
    .slide {
      grid-template-columns: 1fr;
      grid-template-rows: 38vh 1fr;
    }
    .photo {
      order: -1;
      max-height: 38vh;
      min-height: 280px;
    }
    .photo img {
      mask-image: linear-gradient(180deg, #000 55%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 100%);
      object-position: center 25%;
    }
    .content {
      padding: 2.4rem 1.4rem 7rem;
      gap: .9rem;
      max-width: 100%;
      justify-content: flex-start;
    }
    .content::before { display: none; }

    /* Decorative cleanup */
    .watermark { display: none; }
    .badge {
      top: auto;
      bottom: calc(62vh + .8rem);
      inset-inline-start: 1.2rem;
      padding: .45rem .8rem;
      font-size: .65rem;
      letter-spacing: .18em;
    }
    .badge .pulse { width: 6px; height: 6px; }

    /* Tighter typography */
    .name { font-size: clamp(2.4rem, 11vw, 3.6rem); }
    .role { font-size: .8rem; letter-spacing: .14em; }
    .bio { font-size: .9rem; line-height: 1.55; max-width: 100%; }
    .quote { font-size: .9rem; padding: .4rem .8rem; }

    /* Stats — still 3 cols but compact */
    .stats { gap: .5rem; }
    .stat { padding: .7rem .8rem; border-radius: 10px; }
    .stat .v { font-size: 1.25rem; }
    .stat .l { font-size: .6rem; letter-spacing: .15em; }

    /* Tags compact */
    .tag { padding: .35rem .7rem; font-size: .65rem; }

    /* Meta line — hide some bits */
    .meta { font-size: .7rem; letter-spacing: .18em; gap: .6rem; flex-wrap: wrap; }
    .meta .num { font-size: 1rem; }
    .meta > span:nth-child(4),
    .meta > span:nth-child(5) { display: none; }

    /* Topbar — slim, hide nav links, glass backdrop */
    .topbar {
      padding: calc(.9rem + var(--sat)) 1.2rem .9rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: linear-gradient(180deg, rgba(7,7,10,.55), transparent);
    }
    .topbar .right { display: none; }
    .topbar-actions { gap: 0; }
    .brand { font-size: .9rem; letter-spacing: .28em; }

    /* Bottombar — stack: progress on top, dots below */
    .bottombar {
      flex-direction: column;
      align-items: stretch;
      padding: .9rem 1.2rem calc(.9rem + var(--sab));
      gap: .7rem;
      background: linear-gradient(0deg, rgba(7,7,10,.7), transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .dots { gap: .4rem; justify-content: center; }
    .dot-btn { width: 16px; height: 3px; }
    .dot-btn.is-active { width: 28px; }
    .progress { width: 100%; }

    /* Bigger tap targets */
    .nav {
      width: 48px;
      height: 48px;
      background: rgba(7,7,10,.55);
      border: 1px solid rgba(255,255,255,.18);
    }
    .nav.prev { inset-inline-start: .8rem; }
    .nav.next { inset-inline-end: .8rem; }
    .nav svg { width: 20px; height: 20px; }

    /* Hide keyboard hint on touch devices */
    .hint { display: none; }

    /* Counter — top right corner */
    .counter {
      inset-inline-end: 1.2rem;
      bottom: auto;
      top: calc(.8rem + var(--sat));
      font-size: .85rem;
      padding: .35rem .7rem;
      border-radius: 999px;
      background: rgba(7,7,10,.55);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .counter .cur { font-size: 1rem; }
  }

  /* ---- Small phones (≤ 420px) ---- */
  @media (max-width: 420px) {
    .slide { grid-template-rows: 32vh 1fr; }
    .photo { max-height: 32vh; min-height: 240px; }
    .badge { bottom: calc(68vh + .6rem); }
    .content { padding: 1.8rem 1.1rem 6.5rem; gap: .75rem; }
    .name { font-size: clamp(2.1rem, 12vw, 2.8rem); }
    .role { font-size: .72rem; }
    .bio { font-size: .82rem; }
    .stats { grid-template-columns: repeat(3, 1fr); gap: .35rem; }
    .stat { padding: .6rem .55rem; }
    .stat .v { font-size: 1.05rem; }
    .stat .l { font-size: .55rem; }
    .tag { font-size: .6rem; padding: .3rem .6rem; }
    .quote { font-size: .82rem; }
    .nav { width: 42px; height: 42px; }
    .nav.prev { inset-inline-start: .5rem; }
    .nav.next { inset-inline-end: .5rem; }
  }

  /* ---- Very short landscape phones ---- */
  @media (max-height: 500px) and (orientation: landscape) {
    .slide {
      grid-template-columns: 1fr 1.2fr;
      grid-template-rows: 1fr;
    }
    .photo { order: 0; max-height: 100vh; min-height: 0; }
    .photo img {
      mask-image: linear-gradient(90deg, #000 70%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, #000 70%, transparent 100%);
    }
    .badge { top: 1rem; bottom: auto; inset-inline-start: 1rem; }
    .content { padding: 1.2rem 1.4rem; gap: .6rem; }
    .name { font-size: clamp(2rem, 6vw, 3rem); }
    .role { font-size: .7rem; }
    .bio { font-size: .8rem; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .quote { display: none; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .stat { padding: .5rem .6rem; }
    .stat .v { font-size: 1rem; }
    .stat .l { font-size: .55rem; }
    .tags { display: none; }
    .watermark { display: none; }
  }

  /* ---- Very large screens ---- */
  @media (min-width: 1600px) {
    .content { padding: 8vh 8vw; }
    .name { font-size: clamp(5rem, 8vw, 8rem); }
  }

  /* ============================================================
     RTL OVERRIDES
     (For things that logical properties can't auto-flip:
      SVG icon mirroring, transform-origin, etc.)
     ============================================================ */
html[dir="rtl"] {
  direction: rtl;
}

/* Mirror arrow chevrons in RTL */
html[dir="rtl"] .nav svg { transform: scaleX(-1); }

/* Dot fill animation grows from the inline-start edge */
html[dir="rtl"] .dot-btn.is-active::after {
  transform-origin: right;
}

/* Loader ring spins the other way in RTL (feels more natural) */
html[dir="rtl"] .loader .ring {
  animation-direction: reverse;
}

/* Topbar layout — keep brand on start, controls on end */
html[dir="rtl"] .topbar { flex-direction: row-reverse; }

/* Meta line dots — the visual separator dots stay; just keep flex order */
html[dir="rtl"] .meta { flex-direction: row-reverse; }

/* On mobile, ensure the hint+counter don't overlap */
@media (max-width: 768px) {
  html[dir="rtl"] .lang-toggle { font-size: .65rem; padding: .3rem .55rem; }
}

/* Keep progress fill growing from inline-start (right edge in RTL) */
html[dir="rtl"] .progress span {
  margin-inline-start: auto;
  inset-inline-end: 0;
  inset-inline-start: auto;
}

/* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }

  /* ---------- Loader ---------- */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #07070a;
    display: grid;
    place-items: center;
    transition: opacity .6s ease, visibility 0s linear .6s;
  }
  .loader.hide { opacity: 0; visibility: hidden; }
  .loader .ring {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.15);
    border-top-color: #fff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loader" id="loader"><div class="ring"></div></div>

<div class="slider" id="slider">

  <!-- Top brand bar -->
  <header class="topbar">
    <div class="brand">PULSE<span class="dot">·</span>CLUB</div>
    <div class="topbar-actions">
      <nav class="right">
        <a href="#">Programs</a>
        <a href="#">Schedule</a>
        <a href="#">Join</a>
      </nav>
      <button class="lang-toggle" id="langToggle" aria-label="Toggle language / direction" type="button">
        <span class="lang-opt is-active" data-dir="rtl">AR</span>
        <span class="lang-sep">/</span>
        <span class="lang-opt" data-dir="ltr">EN</span>
      </button>
    </div>
  </header>

  <!-- Side arrows -->
  <button class="nav prev" aria-label="Previous trainer" id="prev">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <button class="nav next" aria-label="Next trainer" id="next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>

  <!-- Slides -->
  <div class="slides" id="slides"><!-- populated by JS --></div>

  <!-- Bottom bar -->
  <div class="bottombar">
    <div class="progress"><span id="progress"></span></div>
    <div class="dots" id="dots"></div>
  </div>

  <!-- Counter & hint -->
  <div class="counter"><span class="cur" id="cur">01</span><span class="slash">/</span><span id="total">12</span></div>
  <div class="hint"><span>Navigate</span><kbd>←</kbd><kbd>→</kbd><span>or swipe</span></div>

</div>

<script>
  /* ---------- Trainer data (12) ---------- */
  const trainers = [
    {
      theme: 1, accent: '#6ee7b7',
      num: '01', category: 'Yoga · Mindfulness',
      name: 'Aria Chen',
      role: 'Lead Yoga & Breathwork Instructor',
      bio: 'Blending traditional Hatha with modern somatic movement, Aria guides you into stillness — where flexibility, focus and recovery meet.',
      quote: '"Inhale the present. Exhale everything else."',
      img: 'https://i.pravatar.cc/900?img=47',
      tags: ['Vinyasa', 'Pranayama', 'Meditation', 'Mobility'],
      stats: [{ v: '12', l: 'Years' }, { v: '4K+', l: 'Sessions' }, { v: 'RYT-500', l: 'Certified' }]
    },
    {
      theme: 2, accent: '#fb7185',
      num: '02', category: 'HIIT · Conditioning',
      name: 'Marcus Steel',
      role: 'High-Intensity Performance Coach',
      bio: 'Former track athlete turned fat-torching machine-builder. Marcus designs 45-minute sessions that rewire your cardiovascular ceiling.',
      quote: '"The body achieves what the mind believes — twice as fast."',
      img: 'https://i.pravatar.cc/900?img=12',
      tags: ['HIIT', 'Sprint', 'Metcon', 'Endurance'],
      stats: [{ v: '9', l: 'Years' }, { v: '7.2K', l: 'Clients' }, { v: 'NSCA-CPT', l: 'Certified' }]
    },
    {
      theme: 3, accent: '#f472b6',
      num: '03', category: 'Pilates · Core',
      name: 'Sofia Vargas',
      role: 'Reformer Pilates Specialist',
      bio: 'From ballet stages to the reformer bed, Sofia brings grace and grit to every core engagement. Expect deep postural transformation.',
      quote: '"Strength is quiet. Control is everything."',
      img: 'https://i.pravatar.cc/900?img=45',
      tags: ['Reformer', 'Mat', 'Pre/Postnatal', 'Barre'],
      stats: [{ v: '10', l: 'Years' }, { v: '3.8K', l: 'Members' }, { v: 'PMA-CPT', l: 'Certified' }]
    },
    {
      theme: 4, accent: '#dc2626',
      num: '04', category: 'Boxing · Combat',
      name: 'Kenji Tanaka',
      role: 'Boxing & Striking Coach',
      bio: 'Former national featherweight. Kenji teaches ring-craft with patience — footwork first, fists second, humility always.',
      quote: '"Discipline beats talent when talent forgets to show up."',
      img: 'https://i.pravatar.cc/900?img=33',
      tags: ['Boxing', 'Kickboxing', 'Footwork', 'Defense'],
      stats: [{ v: '15', l: 'Years' }, { v: '22-3', l: 'Pro Record' }, { v: 'USA-Boxing', l: 'Certified' }]
    },
    {
      theme: 5, accent: '#d946ef',
      num: '05', category: 'Dance · Movement',
      name: 'Isabella Rossi',
      role: 'Choreographer & Dance Coach',
      bio: 'Milan to Miami to the studio floor. Isabella turns cardio into art — every class a story told through the body.',
      quote: '"Dance is the hidden language of the soul."',
      img: 'https://i.pravatar.cc/900?img=44',
      tags: ['Heels', 'Hip-Hop', 'Contemporary', 'Cardio-Dance'],
      stats: [{ v: '11', l: 'Years' }, { v: '5', l: 'Awards' }, { v: 'ACE-GFI', l: 'Certified' }]
    },
    {
      theme: 6, accent: '#f59e0b',
      num: '06', category: 'CrossFit · Functional',
      name: 'Damian Cross',
      role: 'CrossFit & Functional Movement',
      bio: 'Marine-veteran energy wrapped in Olympic-lifting precision. Damian scales every WOD so beginners and beasts both grow.',
      quote: '"Constantly varied. Always humbled."',
      img: 'https://i.pravatar.cc/900?img=68',
      tags: ['Olympic Lifts', 'Gymnastics', 'WODs', 'Grit'],
      stats: [{ v: '14', l: 'Years' }, { v: 'CF-L3', l: 'Trainer' }, { v: '2x Games', l: 'Competitor' }]
    },
    {
      theme: 7, accent: '#84cc16',
      num: '07', category: 'Nutrition · Wellness',
      name: 'Nina Patel',
      role: 'Holistic Nutrition Coach',
      bio: 'Registered dietitian with a culinary twist. Nina decodes macros, micronutrients, and the psychology of every craving.',
      quote: '"Eat the rainbow. Skip the labels."',
      img: 'https://i.pravatar.cc/900?img=49',
      tags: ['Macro Coaching', 'Meal Plans', 'Gut Health', 'Supplements'],
      stats: [{ v: '8', l: 'Years' }, { v: '1.4K', l: 'Clients' }, { v: 'RD, CSSD', l: 'Certified' }]
    },
    {
      theme: 8, accent: '#3b82f6',
      num: '08', category: 'Strength · Powerlifting',
      name: 'Leo Fischer',
      role: 'Strength & Powerlifting Coach',
      bio: 'Cradle-to-bar specialist. Leo programs intelligent progressions that build bone density, posture, and a quiet kind of confidence.',
      quote: '"Lift the bar. Lift yourself."',
      img: 'https://i.pravatar.cc/900?img=15',
      tags: ['Powerlifting', 'Hypertrophy', 'Programming', 'Mobility'],
      stats: [{ v: '13', l: 'Years' }, { v: '600+', l: 'DL (lb)' }, { v: 'USAPL-C', l: 'Certified' }]
    },
    {
      theme: 9, accent: '#f97316',
      num: '09', category: 'Cardio · Endurance',
      name: 'Maya Okonkwo',
      role: 'Running & Endurance Coach',
      bio: 'Two-time marathoner with a soft spot for first-mile-beginners. Maya turns dread into dopamine, one zone-2 chat at a time.',
      quote: '"Run toward yourself — everyone else is optional."',
      img: 'https://i.pravatar.cc/900?img=20',
      tags: ['Running', 'Zone-2', 'Marathon', 'Treadmill'],
      stats: [{ v: '9', l: 'Years' }, { v: '4', l: 'Marathons' }, { v: 'RRCA', l: 'Certified' }]
    },
    {
      theme: 10, accent: '#6366f1',
      num: '10', category: 'Martial Arts',
      name: 'Hiroshi Sato',
      role: 'Karate & Brazilian Jiu-Jitsu',
      bio: 'Third-degree black belt in Karate, purple belt in BJJ. Hiroshi blends striking and grappling into a moving meditation.',
      quote: '"Master the mind. The body follows."',
      img: 'https://i.pravatar.cc/900?img=60',
      tags: ['Karate', 'BJJ', 'Self-Defense', 'Kata'],
      stats: [{ v: '20', l: 'Years' }, { v: '3rd Dan', l: 'Black Belt' }, { v: 'IBJJF', l: 'Registered' }]
    },
    {
      theme: 11, accent: '#a78bfa',
      num: '11', category: 'Recovery · Mobility',
      name: 'Elena Petrov',
      role: 'Recovery & Stretch Therapist',
      bio: 'Where training ends, recovery begins. Elena uses assisted stretching, myofascial release and breath to rebuild what you broke.',
      quote: '"Restore. Rebuild. Rise."',
      img: 'https://i.pravatar.cc/900?img=26',
      tags: ['Mobility', 'Stretch', 'Myofascial', 'Breath'],
      stats: [{ v: '7', l: 'Years' }, { v: '2K+', l: 'Sessions' }, { v: 'FRC-MSF', l: 'Certified' }]
    },
    {
      theme: 12, accent: '#06b6d4',
      num: '12', category: 'Cycling · Performance',
      name: 'Theo Laurent',
      role: 'Indoor Cycling & Wattage Coach',
      bio: 'Ex-pro cyclist turned spin architect. Theo programs watt-based intervals that deliver race-day fitness from a dark studio.',
      quote: '"Pedal into purpose. Suffering is optional."',
      img: 'https://i.pravatar.cc/900?img=11',
      tags: ['Indoor Cycling', 'FTP', 'Climbing', 'Sprint'],
      stats: [{ v: '10', l: 'Years' }, { v: '380W', l: 'FTP' }, { v: 'Schwinn-MFA', l: 'Certified' }]
    }
  ];

  /* ---------- DOM ---------- */
  const slidesEl = document.getElementById('slides');
  const dotsEl   = document.getElementById('dots');
  const curEl    = document.getElementById('cur');
  const totalEl  = document.getElementById('total');
  const progressEl = document.getElementById('progress');
  const prevBtn  = document.getElementById('prev');
  const nextBtn  = document.getElementById('next');
  const loader   = document.getElementById('loader');

  totalEl.textContent = String(trainers.length).padStart(2, '0');

  /* ---------- Render slides ---------- */
  function buildSlides() {
    trainers.forEach((t, i) => {
      const slide = document.createElement('section');
      slide.className = 'slide' + (i === 0 ? ' is-active' : '');
      slide.dataset.theme = t.theme;
      slide.style.setProperty('--accent', t.accent);
      slide.innerHTML = `
        <div class="bg"><div class="veil"></div></div>
        <div class="grain"></div>
        <div class="badge"><span class="pulse"></span>${t.category}</div>
        <div class="watermark">${t.num}</div>

        <div class="content">
          <div class="meta anim d1"><span class="num">${t.num}</span><span class="dot"></span><span>${trainers.length} Trainers</span><span class="dot"></span><span>PULSE CLUB</span></div>
          <h1 class="name anim d2">${t.name}</h1>
          <div class="role anim d3">${t.role}</div>
          <p class="bio anim d4">${t.bio}</p>
          <p class="quote anim d5">${t.quote}</p>
          <div class="stats anim d6">
            ${t.stats.map(s => `<div class="stat"><div class="v">${s.v}</div><div class="l">${s.l}</div></div>`).join('')}
          </div>
          <div class="tags anim d7">
            ${t.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </div>

        <div class="photo">
          <div class="photo-wrap">
            <img src="${t.img}" alt="${t.name}" loading="${i < 3 ? 'eager' : 'lazy'}" />
          </div>
        </div>
      `;
      slidesEl.appendChild(slide);

      const dot = document.createElement('button');
      dot.className = 'dot-btn' + (i === 0 ? ' is-active' : '');
      dot.setAttribute('aria-label', `Go to trainer ${i + 1}`);
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    });
  }
  buildSlides();

  /* ---------- Slider state ---------- */
  let idx = 0;
  const slides = slidesEl.querySelectorAll('.slide');
  const dots   = dotsEl.querySelectorAll('.dot-btn');
  let autoTimer = null;
  const AUTO_MS = 8000;

  function goTo(n) {
    n = ((n % trainers.length) + trainers.length) % trainers.length;
    if (n === idx) return;
    slides[idx].classList.remove('is-active');
    dots[idx].classList.remove('is-active');
    idx = n;
    slides[idx].classList.add('is-active');
    dots[idx].classList.add('is-active');
    curEl.textContent = String(idx + 1).padStart(2, '0');
    // Update accent color on root
    document.documentElement.style.setProperty('--accent', trainers[idx].accent);
    // Progress bar
    progressEl.style.width = `${((idx + 1) / trainers.length) * 100}%`;
    // restart auto timer
    restartAuto();
  }
  function next() { goTo(idx + 1); }
  function prev() { goTo(idx - 1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  /* ---------- Language / Direction toggle ---------- */
  const langToggle = document.getElementById('langToggle');
  const langOpts   = langToggle.querySelectorAll('.lang-opt');
  const htmlRoot   = document.documentElement;

  function setDirection(dir) {
    htmlRoot.dir  = dir;
    htmlRoot.lang = dir === 'rtl' ? 'ar' : 'en';
    langOpts.forEach(o => o.classList.toggle('is-active', o.dataset.dir === dir));
  }
  setDirection('rtl'); // default

  langToggle.addEventListener('click', () => {
    setDirection(htmlRoot.dir === 'rtl' ? 'ltr' : 'rtl');
  });
  // Allow clicking each option directly
  langOpts.forEach(o => o.addEventListener('click', (e) => {
    e.stopPropagation();
    setDirection(o.dataset.dir);
  }));

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  });

  // Touch swipe
  let tx = 0, ty = 0;
  document.addEventListener('touchstart', (e) => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) next(); else prev();
    }
  }, { passive: true });

  // Mouse wheel (debounced)
  let wheelLock = false;
  document.addEventListener('wheel', (e) => {
    if (wheelLock) return;
    if (Math.abs(e.deltaY) < 30) return;
    wheelLock = true;
    e.deltaY > 0 ? next() : prev();
    setTimeout(() => wheelLock = false, 900);
  }, { passive: true });

  // Auto-advance
  function startAuto() { autoTimer = setInterval(next, AUTO_MS); }
  function stopAuto()  { clearInterval(autoTimer); autoTimer = null; }
  function restartAuto() { stopAuto(); startAuto(); }

  // Pause on hover
  document.getElementById('slider').addEventListener('mouseenter', stopAuto);
  document.getElementById('slider').addEventListener('mouseleave', startAuto);

  /* ---------- Parallax on mouse move ---------- */
  document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - .5) * 12;
    const y = (e.clientY / window.innerHeight - .5) * 12;
    const active = slides[idx];
    const img = active.querySelector('.photo img');
    if (img) img.style.transform = `scale(1.04) translate(${x}px, ${y}px)`;
  });

  /* ---------- Init ---------- */
  document.documentElement.style.setProperty('--accent', trainers[0].accent);
  progressEl.style.width = `${(1 / trainers.length) * 100}%`;
  startAuto();

  // Hide loader after images start loading
  window.addEventListener('load', () => {
    setTimeout(() => loader.classList.add('hide'), 350);
  });
</script>
</body>
